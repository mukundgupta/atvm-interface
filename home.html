<script>
  // --- Responsive scale-to-fit logic for 1890x3024 portrait ---
  function scaleContent() {
    const baseW = 1890,
      baseH = 3024;
    const wrapper = document.getElementById("scale-viewport-wrapper");
    const content = document.getElementById("scale-viewport-content");
    if (!wrapper || !content) return;
    const ww = window.innerWidth,
      wh = window.innerHeight;
    // Fit by min scale to cover both width and height
    const scale = Math.min(ww / baseW, wh / baseH);
    content.style.transform = `scale(${scale})`;
    content.style.transformOrigin = "top left";
    // Center the scaled content
    content.style.position = "absolute";
    content.style.left = `${(ww - baseW * scale) / 2}px`;
    content.style.top = `${(wh - baseH * scale) / 2}px`;
    content.style.width = baseW + "px";
    content.style.height = baseH + "px";
    wrapper.style.overflow = "hidden";
    wrapper.style.position = "fixed";
    wrapper.style.top = "0";
    wrapper.style.left = "0";
    wrapper.style.width = "100vw";
    wrapper.style.height = "100vh";
    wrapper.style.background = "var(--color-background, #ebebeb)";
  }
  window.addEventListener("resize", scaleContent);
  window.addEventListener("DOMContentLoaded", scaleContent);
</script>
