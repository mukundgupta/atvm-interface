<div class="scale-wrapper">
  <section id="header" class="header-section">
    <div class="container">
      <header class="app-header">
        <nav class="tabs">
          <a href="#station" class="tab-item active">Station</a>
          <a href="#details" class="tab-item">Details</a>
          <a href="#pay" class="tab-item">Pay</a>
        </nav>
      </header>
    </div>
  </section>

  <section id="main" class="main-section">
    <div class="container">
      <main class="main-content-wrapper">
        <h1 class="greeting">नमस्ते</h1>
        <div class="content-placeholder"></div>
        <div class="language-selector">
          <button class="lang-button btn-english">English</button>
          <button class="lang-button btn-hindi">हिन्दी</button>
          <button class="lang-button btn-marathi">मराठी</button>
        </div>
      </main>
    </div>
  </section>

  <section id="footer" class="footer-section">
    <div class="container">
      <footer class="app-footer">
        <div class="time-info">
          <img
            src="${ASSET_PATH}/2473_1190.svg"
            alt="Clock icon"
            class="clock-icon"
          />
          <span class="time-text">12:00</span>
        </div>
        <div class="location-info">
          <span class="location-text">Ulhasnagar</span>
        </div>
      </footer>
    </div>
  </section>
</div>

<style>
  :root {
    /* Colors */
    --color-primary-dark: #003555;
    --color-primary: #045282;
    --color-primary-light: #035182;
    --color-secondary-light: #d4e7f2;
    --color-background: #ebebeb;

    /* Fonts */
    --font-noto-sans: "Noto Sans", sans-serif;
    --font-bengali-ui: "Noto Sans Bengali UI", sans-serif;
    --font-devanagari-ui: "Noto Sans Devanagari UI", sans-serif;

    /* Spacing */
    --header-to-greeting: 88px;
    --greeting-to-placeholder: 127px;
    --placeholder-to-buttons: 116px;
    --buttons-to-footer: 233px;
    --button-gap: 64px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* hide scrollbars */
    background-color: var(--color-background);
    font-family: var(--font-noto-sans);
  }

  .scale-wrapper {
    width: 1890px;
    height: 3024px;
    transform-origin: top left;
    transform: scale(0.5); /* initial scale */
  }

  .container {
    max-width: 1890px;
    margin: 0 auto;
    padding: 0 145px;
  }

  .header-section {
    background-color: var(--color-primary);
    padding-top: 40px;
  }

  .tabs {
    display: flex;
    justify-content: space-between;
  }

  .tab-item {
    color: var(--color-primary-dark);
    font-family: var(--font-noto-sans);
    font-weight: 700;
    font-size: 48px;
    line-height: 1.2;
    letter-spacing: 8.16px;
    text-align: center;
    text-decoration: none;
    flex-basis: 33.33%;
    padding-bottom: 30px;
    border-bottom: 12px solid transparent;
  }

  .tab-item.active {
    border-bottom-color: var(--color-primary-dark);
  }

  .main-section {
    background-color: var(--color-background);
    padding-top: var(--header-to-greeting);
    padding-bottom: var(--buttons-to-footer);
  }

  .main-content-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .greeting {
    color: var(--color-primary-light);
    font-family: var(--font-devanagari-ui);
    font-weight: 700;
    font-size: 384px;
    line-height: 1.2;
    letter-spacing: -8.83px;
    text-align: center;
    margin: 0;
  }

  .content-placeholder {
    background-color: var(--color-secondary-light);
    border-radius: 20px;
    width: 100%;
    height: 1502px;
    margin-top: var(--greeting-to-placeholder);
  }

  .language-selector {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: var(--button-gap);
    margin-top: var(--placeholder-to-buttons);
    width: 100%;
  }

  .lang-button {
    background-color: var(--color-primary);
    border: 5px solid var(--color-primary-dark);
    border-radius: 20px;
    color: var(--color-secondary-light);
    font-size: 96px;
    line-height: 1.3;
    cursor: pointer;
    padding: 40px 0;
    flex-grow: 1;
    flex-basis: 25%;
    min-width: 300px;
  }

  .btn-english {
    font-family: var(--font-bengali-ui);
    font-weight: 700;
  }
  .btn-hindi,
  .btn-marathi {
    font-family: var(--font-devanagari-ui);
    font-weight: 600;
    letter-spacing: -2.2px;
  }

  .footer-section {
    background-color: var(--color-primary);
  }
  .app-footer {
    height: 142px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  .time-info {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .clock-icon {
    width: 70px;
    height: 70px;
  }

  .time-text,
  .location-text {
    color: var(--color-secondary-light);
    font-family: var(--font-bengali-ui);
    font-weight: 500;
    font-size: 50px;
    line-height: 1.3;
  }
</style>

<script>
  function scaleContent() {
    const wrapper = document.querySelector(".scale-wrapper");
    const scaleX = window.innerWidth / 1890;
    const scaleY = window.innerHeight / 3024;
    const scale = Math.min(scaleX, scaleY);
    wrapper.style.transform = `scale(${scale})`;
  }

  window.addEventListener("resize", scaleContent);
  window.addEventListener("load", scaleContent);
</script>
