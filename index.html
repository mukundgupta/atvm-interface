<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATVM Interface Redesign</title>
    <!-- Import Noto Sans font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- This container enforces the 16:10 vertical aspect ratio -->
    <div class="atvm-container">
      <!-- ===== SCREEN 1: WELCOME ===== -->
      <div id="welcome-screen" class="screen">
        <!-- This screen remains as updated in the previous step -->
        <header class="station-header">
          <div class="step"><span>Station</span></div>
          <div class="step"><span>Details</span></div>
          <div class="step"><span>Pay</span></div>
        </header>

        <main class="welcome-main">
          <div class="welcome-title">नमस्ते</div>
          <div class="welcome-placeholder"></div>
          <div class="language-buttons">
            <button class="lang-btn">English</button>
            <button class="lang-btn">हिन्दी</button>
            <button class="lang-btn">मराठी</button>
          </div>
        </main>

        <footer class="screen-footer">
          <div class="time-container">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="time" id="welcome-time">12:00</span>
          </div>
          <div class="location">Ulhasnagar</div>
        </footer>
      </div>

      <!-- ===== SCREEN 2: STATION SELECT ===== -->
      <div id="station-screen" class="screen">
        <header class="station-header">
          <!-- UPDATED BACK BUTTON -->
          <button class="back-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="step active"><span>Station</span></div>
          <div class="step"><span>Details</span></div>
          <div class="step"><span>Pay</span></div>
        </header>

        <main class="station-main">
          <div class="map-container">
            <div class="map-placeholder">
              <p>
                This area would contain the interactive<br />Mumbai Suburban
                Railway Map (SVG)
              </p>
              <div class="legend">
                <div><span class="dot red"></span> Western Line</div>
                <div><span class="dot blue"></span> Central Line</div>
                <div><span class="dot green"></span> Harbour Line</div>
              </div>
            </div>
          </div>

          <!-- TICKET CONTROLS -->
          <div class="ticket-controls">
            <button class="platform-ticket-btn">Platform<br />Ticket</button>

            <div class="station-input-container">
              <label>From station</label>
              <div class="input-wrapper">
                <span class="search-icon"></span>
                <input
                  type="text"
                  value="Chhatrapati Shivaji Maharaj Terminus"
                  readonly
                />
                <span class="clear-icon">×</span>
              </div>
            </div>

            <div class="station-input-container">
              <label>To station</label>
              <div class="input-wrapper">
                <span class="search-icon"></span>
                <input type="text" placeholder="Search..." />
                <!-- CLEAR ICON REMOVED FROM HERE -->
              </div>
            </div>
          </div>
          <!-- END OF CONTROLS -->
        </main>

        <footer class="screen-footer">
          <div class="time-container">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="time" id="station-time">12:00</span>
          </div>
          <div class="location">Ulhasnagar</div>
        </footer>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
